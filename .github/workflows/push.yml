name: Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  coverage:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Decides whether this push changed anything that reaches the shipped image.
  # Deliberately a deny-list: an unrecognised path counts as shippable, so a
  # new source directory can never be silently excluded from releases.
  changes:
    runs-on: ubuntu-latest
    outputs:
      shippable: ${{ steps.filter.outputs.shippable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether this push ships
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Fail safe: if the diff base is unusable (first push, force push,
          # pruned object) release rather than silently skipping one.
          if [ -z "${BEFORE}" ] \
             || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Diff base unavailable; defaulting to release."
            echo "shippable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${BEFORE}" "${AFTER}")"
          echo "Changed files:"
          echo "${changed}"

          # Paths that cannot affect the built image or the running app.
          shippable="$(printf '%s\n' "${changed}" | grep -vE \
            '(^docs/|^\.github/(dependabot\.yml$|ISSUE_TEMPLATE/)|^LICENSE$|^\.gitignore$|^\.editorconfig$|\.md$)' \
            || true)"

          if [ -z "${shippable}" ]; then
            echo "Only release-irrelevant paths changed; skipping release."
            echo "shippable=false" >> "$GITHUB_OUTPUT"
          else
            echo "Shippable changes:"
            echo "${shippable}"
            echo "shippable=true" >> "$GITHUB_OUTPUT"
          fi

  auto-release:
    needs: [ci, changes]
    if: needs.changes.outputs.shippable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # The old logic was always "latest tag + 1 patch", so a feat could never
      # cut a minor and a breaking change could never cut a major — the version
      # carried no information about what changed. python-semantic-release reads
      # the conventional commit types instead. It only computes here: no write,
      # no commit, no tag. The tag below is still ours to create.
      - name: Compute the next version
        id: bump
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "python-semantic-release==10.6.2"
          if next=$(semantic-release version --print 2>/dev/null) && [ -n "$next" ]; then
            echo "next=v${next}" >> "$GITHUB_OUTPUT"
            echo "Next version: v${next}"
          else
            # Nothing releasable since the last tag (docs, chore, ci only).
            echo "next=" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the last tag; skipping the release."
          fi

      - name: Create tag
        if: steps.bump.outputs.next != ''
        run: |
          git tag "${{ steps.bump.outputs.next }}"
          git push origin "${{ steps.bump.outputs.next }}"

  build-and-scan:
    needs: auto-release
    if: needs.auto-release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          load: true
          tags: morsl:scan
          build-args: APP_VERSION=${{ needs.auto-release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # 0.36.0
        with:
          image-ref: morsl:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: trivy-results.sarif

  push-image:
    needs: [auto-release, build-and-scan]
    if: needs.auto-release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.auto-release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.auto-release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: [auto-release, push-image]
    if: needs.auto-release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v2
        with:
          tag_name: ${{ needs.auto-release.outputs.tag }}
          generate_release_notes: true

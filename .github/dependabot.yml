version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: pulp
        update-types: ["version-update:semver-major"]
    groups:
      pip-patches:
        update-types: ["patch"]
      pip-minors:
        update-types: ["minor"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # web-vue/ was previously uncovered: no npm ecosystem meant the Vite
  # frontend got no version updates at all, so its lockfile drifted until
  # 7 advisories accumulated with no PR ever opened for them.
  - package-ecosystem: npm
    directory: /web-vue
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-patches:
        update-types: ["patch"]
      npm-minors:
        update-types: ["minor"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

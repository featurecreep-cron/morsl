version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: pulp
        update-types: ["version-update:semver-major"]
    groups:
      pip-patches:
        update-types: ["patch"]
      pip-minors:
        update-types: ["minor"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # web-vue/ was previously uncovered: no npm ecosystem meant the Vite
  # frontend got no version updates at all, so its lockfile drifted until
  # 7 advisories accumulated with no PR ever opened for them.
  - package-ecosystem: npm
    directory: /web-vue
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # TypeScript 7 is the Go compiler and dropped the programmatic compiler
      # API that vue-tsc drives, so `vue-tsc -b` dies with
      # ERR_PACKAGE_PATH_NOT_EXPORTED on typescript/lib/tsc and the image build
      # fails. No vue-tsc release fixes this — verified against 3.3.10, the
      # latest. Drop this ignore when vuejs/language-tools#5381 ships.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-patches:
        update-types: ["patch"]
      npm-minors:
        update-types: ["minor"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
